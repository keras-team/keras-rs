name: Publish to PyPI

on: push

permissions:
  contents: read

jobs:
  build-and-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Get pip cache dir
        id: pip-cache
        run: |
          python -m pip install --upgrade pip setuptools
          echo "dir=$(pip cache dir)" >> $GITHUB_OUTPUT
      - name: pip cache
        # zizmor: ignore[cache-poisoning]
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pip-cache.outputs.dir }}
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}-${{ hashFiles('requirements.txt') }}
      - name: Install dependencies
        run: |
            python -m pip install --upgrade pip setuptools
            pip install -r requirements.txt --progress-bar off
            pip install twine
      - name: Build a binary wheel and a source tarball
        run: >-
          python pip_build.py
      - name: Authenticate to Google Cloud (OSS Exit Gate)
        if: startsWith(github.ref, 'refs/tags')
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: 'projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github'

      - name: Set up Cloud SDK
        if: startsWith(github.ref, 'refs/tags')
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Clean up failed staging attempt for this exact version (if any)
        if: startsWith(github.ref, 'refs/tags')
        id: exit_gate_cleanup
        run: |
          set -euo pipefail
          PKG_VER=$(python3 - <<'PY'
          import email, glob, tarfile, zipfile
          files = sorted(glob.glob("dist/**/*.whl", recursive=True) + glob.glob("dist/**/*.tar.gz", recursive=True))
          assert files, "No distributions found in dist/"
          f = files[0]
          if f.endswith(".whl"):
            with zipfile.ZipFile(f) as zf:
              meta = [n for n in zf.namelist() if n.endswith(".dist-info/METADATA")][0]
              raw = zf.read(meta).decode()
          else:
            with tarfile.open(f) as tf:
              info = [m for m in tf.getmembers() if m.name.endswith("/PKG-INFO") or m.name == "PKG-INFO"][0]
              raw = tf.extractfile(info).read().decode()
          print(email.message_from_string(raw)["Version"].strip())
          PY
          )
          echo "pkg_ver=${PKG_VER}" >> "$GITHUB_OUTPUT"
          if gcloud artifacts versions describe "${PKG_VER}" \
            --package="keras-rs" \
            --project="oss-exit-gate-prod" \
            --location="us" \
            --repository="keras-rs--pypi" >/dev/null 2>&1; then
            gcloud artifacts versions delete "${PKG_VER}" \
              --package="keras-rs" \
              --project="oss-exit-gate-prod" \
              --location="us" \
              --repository="keras-rs--pypi" \
              --quiet
          fi

      - name: Stage distributions to OSS Exit Gate and upload manifest
        if: startsWith(github.ref, 'refs/tags')
        env:
          PKG_VER: ${{ steps.exit_gate_cleanup.outputs.pkg_ver }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          DIST_FILES=(dist/**/*.whl dist/**/*.tar.gz)
          python3 -m pip install --upgrade twine
          TWINE_PASSWORD="$(gcloud auth print-access-token)"
          python3 -m twine upload \
            --repository-url "https://us-python.pkg.dev/oss-exit-gate-prod/keras-rs--pypi/" \
            -u oauth2accesstoken \
            -p "${TWINE_PASSWORD}" \
            "${DIST_FILES[@]}"
          cat <<EOF > manifest.json
          {
            "publish_all": false,
            "publishing_groups": [
              {
                "packages": [
                  {
                    "name": "keras-rs",
                    "version": "${PKG_VER}"
                  }
                ]
              }
            ]
          }
          EOF
          gcloud storage cp manifest.json \
            "gs://oss-exit-gate-prod-projects-bucket/keras-rs/pypi/manifests/manifest-${PKG_VER}-${RUN_ID}-${RUN_ATTEMPT}.json"


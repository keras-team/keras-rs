name: Nightly

on:
  workflow_dispatch: # To Generate wheels on demand outside of schedule.
  schedule:
    - cron: '0 3 * * *' # run at 3 AM UTC / 8 PM PDT

permissions:
  contents: read

jobs:
  check_commits:
    runs-on: ubuntu-latest
    name: Check latest commit
    outputs:
      has_recent_commits: ${{ steps.check.outputs.has_recent_commits }}
    steps:
      - name: Checkout ${{ github.ref }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: check
        run: |
          # Check for commits in the last 25 hours (use a 1 hour margin)
          if [ -z "$(git rev-list --after="25 hours" ${{ github.sha }})" ]; then
            echo "has_recent_commits=false" >> $GITHUB_OUTPUT
          else
            echo "has_recent_commits=true" >> $GITHUB_OUTPUT
          fi

  cpu_tests:
    needs: [check_commits]
    if: ${{needs.check_commits.outputs.has_recent_commits == 'true'}}
    uses: ./.github/workflows/cpu_tests.yml  # zizmor: ignore[self-repository]
    with:
      timeout: 240

  nightly:
    name: Build Wheel file and upload
    needs: [check_commits, cpu_tests]
    if: ${{needs.check_commits.outputs.has_recent_commits == 'true'}}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Get pip cache dir
        id: pip-cache
        run: |
          python -m pip install --upgrade pip setuptools
          echo "dir=$(pip cache dir)" >> $GITHUB_OUTPUT
      - name: pip cache
        # zizmor: ignore[cache-poisoning]
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pip-cache.outputs.dir }}
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}-${{ hashFiles('requirements.txt') }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install twine
          pip install -r requirements.txt --progress-bar off
      - name: Build wheel file
        run: |
          python pip_build.py --nightly
      - name: Publish KerasRS Nightly to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          verbose: true
